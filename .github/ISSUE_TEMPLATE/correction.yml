name: 정정 제보 (Correction)
description: 파로스의 항목 기록이 사실과 다르거나 낡았을 때 근거와 함께 알려 주세요.
title: "[정정] "
body:
  - type: markdown
    attributes:
      value: |
        파로스의 판정은 **기록된 사실(facts)** 위에서 계산됩니다. 스토어 표기·가격·업데이트 날짜·과금 구조가
        바뀌었거나 잘못 적혔다면 아래에 근거와 함께 알려 주세요. 확인 후 데이터(`data/{domain}/{arena}.json`)를
        고치고 평가일(`assessed_at`)을 갱신합니다.

        - 항목 id 는 상세 화면 URL의 `item=` 값입니다. 예: `?domain=app&arena=pkm-notes&item=evernote`
        - 근거는 1차 자료(스토어·공식 페이지·개발자 공지)를 가장 높게 봅니다.
        - 광고·협찬 목적의 제보는 받지 않습니다. 파로스는 어필리에이트·유료 광고를 쓰지 않습니다.
  - type: input
    id: item
    attributes:
      label: 대상 항목 id
      description: 상세 화면 URL의 item 값 또는 이름
      placeholder: evernote
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 어떤 기록인가요?
      options:
        - 가격·티어 구조
        - 광고·과금(확률형·P2W·구독)
        - 최근 업데이트·수명 단계
        - 평점·리뷰 표본
        - 분류(도메인·대분류·비교군)
        - 출처·근거 등급
        - 기타
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 파로스에 적힌 값
      description: 지금 화면에 보이는 값(비어 있어도 됩니다)
      placeholder: "예: 최근 업데이트 2022-06-22 · 완결작"
  - type: textarea
    id: correction
    attributes:
      label: 정정 내용
      description: 어떻게 바뀌어야 하는지 구체적으로
      placeholder: "예: 2026-11-20 에 v2.1 업데이트가 있었고, 구독제가 폐지되어 1회 구매로 바뀌었습니다."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 근거 URL
      description: 스토어 페이지·공식 공지·보도 등 1차 자료를 우선합니다
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: grade
    attributes:
      label: 근거 등급
      options:
        - "A — 스토어·공식 페이지에서 직접 확인"
        - "B — 언론 보도·공식 발표 인용"
        - "C — 3자 집계·커뮤니티·개별 리뷰"
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: 이해관계 공개
      options:
        - label: 저는 해당 제품의 개발사·대행사·이해관계자입니다 (해당하면 체크해 주세요)
          required: false
