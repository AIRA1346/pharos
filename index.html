<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>파로스 Pharos — 별점 대신, 내 기준으로 거르는 앱·게임 선별</title>
<meta name="description" content="파로스는 사용자 평가·객관 신뢰 지표·AI 검토를 내 가중치로 합치고, 강제 광고·확률형 아이템 같은 절대 거름 조건을 적용해 앱과 게임을 선별합니다. 도메인 → 대분류 → 비교군 → 항목 순으로 탐색하고, 모든 계산은 브라우저에서 실시간으로 이뤄집니다." />
<meta property="og:title" content="파로스 Pharos — 별점 대신, 내 기준으로 거르는 앱·게임 선별" />
<meta property="og:description" content="별점은 높은데 거름 판정? 파로스는 조건(광고·과금·계정·수명)으로 거르고, 같은 비교군 안에서만 비교합니다." />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070e19'/%3E%3Cpath d='M16 5l3.2 6.4L16 27l-3.2-15.6z' fill='%23f4b75e'/%3E%3Ccircle cx='16' cy='9' r='1.6' fill='%23fff8ea'/%3E%3C/svg%3E" />
</head>
<body>
<a class="skip-link" href="#view">본문으로 건너뛰기</a>

<div class="sea" aria-hidden="true">
  <div class="beam-sweep"></div>
</div>

<header class="topbar">
  <a class="brand" href="./" data-nav="home" aria-label="파로스 홈">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe3ae" />
          <stop offset="100%" stop-color="#f4b75e" stop-opacity="0.15" />
        </linearGradient>
      </defs>
      <path class="mark-beam" d="M24 6 L10 26 H17 L24 6 Z" fill="url(#beamGrad)" opacity="0.75" />
      <path class="mark-beam" d="M24 6 L38 26 H31 L24 6 Z" fill="url(#beamGrad)" opacity="0.45" />
      <path d="M21.2 6h5.6l2.2 26H19z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M18.4 32h11.2l2 8H16.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      <circle cx="24" cy="12" r="2" fill="currentColor" />
      <path d="M15 44h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <span class="brand-text">
      <span class="wordmark">PHAROS<span class="wordmark-sub">파로스</span></span>
      <span class="tagline">별점 대신, 내 기준으로 거르는 앱·게임 선별</span>
    </span>
  </a>

  <nav class="domain-tabs" id="domainTabs" aria-label="도메인 전환"></nav>

  <div class="topbar-side">
    <span class="dataset-chip" id="datasetChip" title="데이터·스키마 버전">불러오는 중…</span>
    <button type="button" class="ghost-btn" id="bookmarkBtn" aria-controls="bookmarkSection">
      <span class="ghost-ico" aria-hidden="true">☆</span>보관함 <span class="count-pill" id="bookmarkCount">0</span>
    </button>
    <button type="button" class="ghost-btn" id="methodBtn"><span class="ghost-ico" aria-hidden="true">?</span>방법론</button>
    <button type="button" class="ghost-btn ghost-btn--tune" id="tuneBtn" aria-expanded="false" aria-controls="tuneDrawer">
      <span class="ghost-ico" aria-hidden="true">⚙</span>내 기준 미세조정
    </button>
    <button type="button" class="ghost-btn" id="themeToggle" aria-pressed="true">
      <span class="ghost-ico" aria-hidden="true">◐</span><span id="themeLabel">다크</span>
    </button>
  </div>
</header>

<div class="crumb-bar">
  <ol class="breadcrumb" id="breadcrumb" aria-label="탐색 경로"></ol>
  <span class="crumb-note" id="crumbNote"></span>
</div>

<main id="view" class="view" tabindex="-1">
  <p class="boot-note" id="bootNote">
    이 페이지는 <strong>정적 HTTP 서버</strong>로 열어야 합니다. <code>projects/pharos/web</code> 폴더에서
    <code>python3 -m http.server 8000</code> 을 실행한 뒤 <code>http://localhost:8000/</code> 로 접속해 주세요.
  </p>
</main>

<div class="compare-bar" id="compareBar" hidden>
  <span class="compare-bar-label">비교 선택</span>
  <span class="compare-bar-list" id="compareList"></span>
  <button type="button" class="primary-btn" id="compareOpen">나란히 비교</button>
  <button type="button" class="text-btn" id="compareClear">비우기</button>
</div>

<div class="drawer-backdrop" id="tuneBackdrop" hidden></div>
<aside class="drawer" id="tuneDrawer" role="dialog" aria-modal="false" aria-label="내 기준 미세조정" hidden>
  <div class="drawer-head">
    <div>
      <p class="mini-label">내 기준</p>
      <h2>미세조정</h2>
    </div>
    <button type="button" class="icon-btn" id="tuneClose" aria-label="미세조정 닫기">✕</button>
  </div>
  <div class="drawer-body" id="tuneBody"></div>
</aside>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-head">
      <div class="modal-titles">
        <div class="chips" id="modalChips"></div>
        <h2 id="modalTitle">—</h2>
        <p class="modal-dev" id="modalDev"></p>
      </div>
      <div class="modal-actions" id="modalActions">
        <button type="button" class="icon-btn" id="modalClose" aria-label="상세 닫기">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="methodBackdrop" hidden>
  <div class="modal modal--method" id="methodModal" role="dialog" aria-modal="true" aria-labelledby="methodTitle" tabindex="-1">
    <div class="modal-head">
      <div class="modal-titles">
        <p class="mini-label">기준·방법론</p>
        <h2 id="methodTitle">파로스가 점수를 매기는 법</h2>
        <p class="modal-dev">가중치·필터·근거 등급·판정 규칙을 그대로 공개합니다.</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="icon-btn" id="methodClose" aria-label="방법론 닫기">✕</button>
      </div>
    </div>
    <div class="modal-body" id="methodBody"></div>
  </div>
</div>

<p class="toast" id="toast" hidden role="status" aria-live="polite"></p>

<noscript>
  <p class="noscript">파로스는 브라우저에서 계산합니다. JavaScript를 켜야 선별 결과가 보입니다.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
